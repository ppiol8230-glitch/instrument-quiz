:root{
  --bg:#FFF6EA; --card:#FFFFFF; --ink:#4A3B32; --sub:#8A7A6E;
  --coral:#FF7E67; --coral-d:#E85F47; --mint:#5FC7AE; --mint-d:#3EA98F;
  --lav:#A78BFA; --sun:#FFC94D; --pink:#FF9EB5; --line:rgba(74,59,50,.14);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
/* 연타 시 더블탭 확대 방지 (iOS Safari) */
button,.opt,.pill,.testbtn,#tapzone,a.btn{touch-action:manipulation}
html,body{margin:0;padding:0}
body{background:var(--bg); color:var(--ink); font-family:'Gowun Dodum',system-ui,sans-serif; line-height:1.6; min-height:100vh}
h1,h2,h3,.jua{font-family:'Jua','Gowun Dodum',sans-serif; font-weight:400; letter-spacing:-.01em}
#doodles{position:fixed; inset:0; overflow:hidden; pointer-events:none; z-index:0}
.doodle{position:absolute; opacity:.09; color:var(--ink)}
#wrap{position:relative; z-index:1; max-width:600px; margin:0 auto; padding:20px 16px 60px}
.card{background:var(--card); border:2px solid var(--line); border-radius:28px; padding:22px 20px; box-shadow:0 6px 0 rgba(74,59,50,.07); margin-bottom:16px}
.btn{display:block; width:100%; border:none; cursor:pointer; font-family:'Jua'; font-size:1.15rem; color:#fff;
  background:var(--coral); border-radius:999px; padding:15px 22px; box-shadow:0 5px 0 var(--coral-d);
  transition:transform .06s, box-shadow .06s; text-align:center}
.btn:active{transform:translateY(4px); box-shadow:0 1px 0 var(--coral-d)}
.btn.mint{background:var(--mint); box-shadow:0 5px 0 var(--mint-d)}
.btn.ghost{background:#fff; color:var(--sub); box-shadow:0 5px 0 rgba(74,59,50,.12); border:2px solid var(--line); font-size:1rem}
.btn.big{font-size:1.32rem; padding:19px 22px; line-height:1.25}
.btn+.btn{margin-top:10px}
.opt{display:block; width:100%; text-align:left; cursor:pointer; background:#fff; border:2px solid var(--line);
  border-radius:20px; padding:14px 16px; margin:10px 0; font-family:'Gowun Dodum'; font-size:1.02rem; color:var(--ink);
  transition:transform .06s, border-color .1s, background .1s; position:relative}
.opt:active{transform:scale(.98)}
.opt.sel{border-color:var(--coral); background:#FFF0EA; box-shadow:0 3px 0 rgba(232,95,71,.25)}
.opt.sel::after{content:"✓"; position:absolute; right:14px; top:50%; transform:translateY(-50%); color:var(--coral); font-family:'Jua'; font-size:1.2rem}
.opt small{color:var(--sub); display:block; font-size:.85rem; line-height:1.4; margin-top:2px}
.flavor{color:var(--sub); font-size:.92rem; margin:4px 0 12px}
.qtitle{font-size:1.3rem; margin:2px 0 2px}
.qicon{font-size:1.9rem; line-height:1}
#bar{height:14px; background:#F3E7D7; border-radius:99px; margin:6px 0 18px; position:relative; overflow:visible}
#barfill{height:100%; background:linear-gradient(90deg,var(--sun),var(--coral)); border-radius:99px; width:0%; transition:width .3s}
#barnote{position:absolute; top:-9px; transition:left .3s; font-size:1.3rem; transform:translateX(-50%)}
.tag{display:inline-block; background:#FFF0EA; color:var(--coral-d); border-radius:99px; padding:2px 12px; font-size:.85rem; font-family:'Jua'; margin:2px 4px 2px 0}
.tag.mint{background:#E5F7F1; color:var(--mint-d)}
.tag.lav{background:#F0EAFE; color:#7C5CE0}
.tag.sun{background:#FFF4D6; color:#B8860B}
.center{text-align:center}
.big-emoji{font-size:4.2rem; line-height:1.1}
.kbd{display:grid; grid-template-columns:repeat(6,1fr); gap:8px; margin:14px 0}
.kbd button{font-family:'Jua'; font-size:1rem; padding:12px 4px; border-radius:14px; border:2px solid var(--line); background:#fff; cursor:pointer; color:var(--ink)}
.kbd button.black{background:#4A3B32; color:#fff}
.kbd button:active{transform:scale(.94)}
#tapzone{width:190px; height:190px; margin:16px auto; border-radius:50%; background:var(--sun); box-shadow:0 8px 0 #E0A92F;
  display:flex; align-items:center; justify-content:center; font-family:'Jua'; font-size:1.4rem; cursor:pointer;
  touch-action:none; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none}
#tapzone:active{transform:translateY(5px); box-shadow:0 3px 0 #E0A92F}
.resCard{border:3px solid var(--coral); position:relative}
.resCard.second{border-color:var(--mint)}
.resCard.third{border-color:var(--lav)}
.crown{position:absolute; top:-22px; left:50%; transform:translateX(-50%); font-size:2rem}
.rank{font-family:'Jua'; color:#fff; background:var(--coral); display:inline-block; border-radius:99px; padding:2px 14px; font-size:.9rem}
.second .rank{background:var(--mint)} .third .rank{background:var(--lav)}
ul.why{padding-left:0; list-style:none; margin:10px 0}
ul.why li{padding:7px 0 7px 30px; position:relative; font-size:.97rem}
ul.why li::before{content:"🎵"; position:absolute; left:0}
ul.why li.warn::before{content:"⚠️"}
.divider{border:none; border-top:2px dashed var(--line); margin:16px 0}
.small{font-size:.88rem; color:var(--sub)}
.fade{animation:fade .35s ease}
@keyframes fade{from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:none}}
.testbtn{font-size:2rem; background:#fff; border:2px solid var(--line); border-radius:20px; padding:14px 22px; cursor:pointer}
.artbox{display:inline-block}
.artbox svg{width:100%; height:100%; display:block}
.backbtn{background:none; border:none; color:var(--sub); font-family:'Jua'; font-size:.95rem; cursor:pointer; padding:4px 8px; margin-bottom:6px}
.backbtn:active{transform:translateX(-3px)}
a.btn{text-decoration:none}
.cb{display:flex; align-items:center; gap:8px; margin:5px 0; font-size:.85rem}
.cb>span{flex:0 0 45%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.cbar{flex:1; height:12px; background:#F3E7D7; border-radius:99px; overflow:hidden}
.cbar i{display:block; height:100%; background:linear-gradient(90deg,var(--sun),var(--coral)); border-radius:99px}
.cb b{flex:0 0 34px; text-align:right; color:var(--coral-d); font-family:'Jua'}
.rar{background:#FFF4D6; border-radius:14px; padding:8px 12px; font-size:.92rem; text-align:center}
details.guide{margin-top:10px; border:2px dashed var(--line); border-radius:16px; padding:10px 14px}
details.guide summary{cursor:pointer; font-family:'Jua'; color:var(--mint-d); list-style:none}
details.guide summary::before{content:"🎒 "}
details.guide p{font-size:.92rem; margin:8px 0}
.radarwrap{display:flex; justify-content:center}
.pillrow{display:flex; gap:10px; flex-wrap:wrap; justify-content:center}
.pill{flex:1; min-width:110px; font-family:'Jua'; font-size:1.05rem; padding:14px; border-radius:18px; border:2px solid var(--line); background:#fff; cursor:pointer; color:var(--ink)}
.pill:active{transform:scale(.96)}
footer{margin-top:30px; text-align:center; color:var(--sub); font-size:.8rem}
@media(min-width:700px){ #wrap{max-width:640px; padding-top:36px} .qtitle{font-size:1.45rem} }

<script>
(function(){
"use strict";
/* ============ 데이터 취합 ============ */
const ALL = [].concat(INST_KEYBOARD_FREEREED, INST_BOWED, INST_FOLK_STRINGS, INST_GUITAR_MANDOLIN,
  INST_HARP_LUTE, INST_WOODWIND_WESTERN, INST_WOODWIND_FOLK, INST_BRASS_MALLET, INST_PERC_HEALING_ELECTRONIC);
const ART = Object.assign({},
  typeof ART_KEYBOARD_FREEREED!=="undefined"?ART_KEYBOARD_FREEREED:{},
  typeof ART_BOWED!=="undefined"?ART_BOWED:{},
  typeof ART_FOLK_STRINGS!=="undefined"?ART_FOLK_STRINGS:{},
  typeof ART_GUITAR_MANDOLIN!=="undefined"?ART_GUITAR_MANDOLIN:{},
  typeof ART_HARP_LUTE!=="undefined"?ART_HARP_LUTE:{},
  typeof ART_WOODWIND_WESTERN!=="undefined"?ART_WOODWIND_WESTERN:{},
  typeof ART_WOODWIND_FOLK!=="undefined"?ART_WOODWIND_FOLK:{},
  typeof ART_BRASS_MALLET!=="undefined"?ART_BRASS_MALLET:{},
  typeof ART_PERC_HEALING_ELECTRONIC!=="undefined"?ART_PERC_HEALING_ELECTRONIC:{});
function artHtml(id, size){ const a=ART[id]; if(!a) return null; return `<span class="artbox" style="width:${size}px;height:${size}px">${a}</span>`; }
const GUIDE = Object.assign({},
  typeof GUIDE_KEYBOARD_FREEREED!=="undefined"?GUIDE_KEYBOARD_FREEREED:{},
  typeof GUIDE_BOWED!=="undefined"?GUIDE_BOWED:{},
  typeof GUIDE_FOLK_STRINGS!=="undefined"?GUIDE_FOLK_STRINGS:{},
  typeof GUIDE_GUITAR_MANDOLIN!=="undefined"?GUIDE_GUITAR_MANDOLIN:{},
  typeof GUIDE_HARP_LUTE!=="undefined"?GUIDE_HARP_LUTE:{},
  typeof GUIDE_WOODWIND_WESTERN!=="undefined"?GUIDE_WOODWIND_WESTERN:{},
  typeof GUIDE_WOODWIND_FOLK!=="undefined"?GUIDE_WOODWIND_FOLK:{},
  typeof GUIDE_BRASS_MALLET!=="undefined"?GUIDE_BRASS_MALLET:{},
  typeof GUIDE_PERC_HEALING_ELECTRONIC!=="undefined"?GUIDE_PERC_HEALING_ELECTRONIC:{});
const RAR_TABLE = typeof RARITY!=="undefined" ? RARITY : {};
const GDESC = {}; GENRES.forEach(g=>GDESC[g.name]=g.desc);
const ETHNIC_GENRES = ["켈틱·아이리시","북유럽 민속","발칸·클레즈머·집시","국악·사물놀이","동아시아 전통","인도·중동","아프리카 리듬","라틴","탱고","플라멩코·스페인"];

function famEmoji(f){
  f = f||"";
  if(/색소폰/.test(f)) return "🎷";
  if(/건반/.test(f)) return "🎹";
  if(/프리리드|아코디언/.test(f)) return "🪗";
  if(/활/.test(f)) return "🎻";
  if(/만돌린|밴조/.test(f)) return "🪕";
  if(/기타|발현/.test(f)) return "🎸";
  if(/하프|류트/.test(f)) return "🎼";
  if(/금관/.test(f)) return "🎺";
  if(/목관|관악/.test(f)) return "🪈";
  if(/타악|드럼|퍼커션/.test(f)) return "🥁";
  if(/힐링|명상/.test(f)) return "🔔";
  if(/전자|특수/.test(f)) return "🎛️";
  return "🎵";
}
function nameEmoji(n,f){
  if(/색소폰/.test(n)) return "🎷";
  if(/하모니카/.test(n)) return "🎶";
  if(/우쿨렐레/.test(n)) return "🌺";
  if(/싱잉볼|공\(/.test(n)) return "🔔";
  if(/드럼|카혼/.test(n)) return "🥁";
  if(/플루트|휘슬|리코더|피리|대금|소금|단소/.test(n)) return "🪈";
  return famEmoji(f);
}

/* ============ 슬롯 확장 (악기 × 트랙) ============ */
const SLOTS = [];
ALL.forEach(inst=>{
  const tr = inst.tracks && inst.tracks.length ? inst.tracks : [null];
  tr.forEach(t=>{
    SLOTS.push({
      inst, track: t,
      key: inst.id + (t? "::"+t.id : ""),
      dispName: inst.name + (t? " — " + t.label : ""),
      genres: {
        main: (t && t.genres && t.genres.length ? t.genres : (inst.genres&&inst.genres.main)||[]),
        sub: (inst.genres&&inst.genres.sub)||[]
      }
    });
  });
});

/* ============ 프로필 ============ */
let P;
function resetP(){
  P = {
    exp:0, expFams:[], mainFam:null, expDir:null, notation:1, chords:0,
    pitch:null, abs:0, melody:0, rhythm:null, singSelf:1,
    no:{saliva:false,callus:false,embouchure:false,heavy:false,posture:false,maint:false,ugly:false},
    handJob:0, breath:2, braces:false, hand:2, pain:[], nails:0, physical:1,
    noiseEnv:2, elec:1, budget:2, learn:"lesson", lessonEnv:2, daily:2, carry:2, care:1,
    vintage:0, ethnic:1, gear:0, trendPref:2, rarityPref:2, improvPref:2, showPref:2,
    patience:2, social:"small", sing:1, repeatOk:1, explore:0, calm:0,
    genres:{}, tones:[], role:null, goal:null, lefty:false, answers:{}, trail:[]
  };
}
function addG(name,w){ P.genres[name]=(P.genres[name]||0)+w; }

/* ============ 질문 정의 ============ */
const FAM_OPTS = [
  {k:"keys", t:"피아노·건반"}, {k:"bow", t:"바이올린·첼로처럼 활로 켜는 것"},
  {k:"pluck", t:"기타·우쿨렐레처럼 뜯는 것"}, {k:"wind", t:"부는 것"},
  {k:"perc", t:"두드리는 것"}, {k:"gugak", t:"국악기"}, {k:"vocal", t:"노래(합창·성악)"}, {k:"daw", t:"컴퓨터 음악"}
];
const FAM_MATCH = {keys:/건반|피아노|아코디언|신디/, bow:/바이올린|비올라|첼로|베이스|활|해금|얼후|피들/, pluck:/기타|우쿨|만돌|류트|하프|밴조|가야금|발현/, wind:/플루트|리코더|클라리넷|색소폰|트럼펫|관|휘슬|오카리나|하모니카/, perc:/드럼|타악|마림바|퍼커션|장구|카혼/, gugak:/국악|가야금|해금|대금|장구|거문고|피리/, daw:/신디|미디|론치|전자/};

const Q = [
{id:"A1", icon:"🎒", title:"악기를 배워본 적 있나요?", flavor:"초등학교 리코더 시간도 어엿한 경력입니다.",
 opts:[
  {t:"처음이에요, 완전 백지", fx:()=>{P.exp=0}},
  {t:"어릴 때 잠깐 (기억은 손가락 어딘가에)", fx:()=>{P.exp=1}},
  {t:"1년 이상 해봤어요", fx:()=>{P.exp=2}},
  {t:"지금도 다루는 악기가 있어요", fx:()=>{P.exp=3}},
 ]},
{id:"A2", icon:"🗂️", title:"해본 것을 모두 골라주세요", flavor:"찔러본 것도 다 포함입니다. 솔직하게!", multi:true,
 when:()=>P.exp>0,

let AC=null, audioUnlocked=false;
const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1);
function ac(){
  if(!AC){ const Ctx=window.AudioContext||window.webkitAudioContext; if(!Ctx) return null; AC=new Ctx(); }
  if(AC.state==="suspended" && AC.resume) AC.resume();
  return AC;
}
// iOS는 사용자 제스처 안에서 컨텍스트를 깨워야 소리가 난다 — 첫 터치에 무음 버퍼로 언락
function unlockAudio(){
  const c=ac(); if(!c) return;
  if(!audioUnlocked){
    try{ const b=c.createBuffer(1,1,22050), src=c.createBufferSource(); src.buffer=b; src.connect(c.destination); src.start(0); audioUnlocked=true; }catch(e){}
  }
  if(c.state==="suspended" && c.resume) c.resume();
}
document.addEventListener("pointerdown", unlockAudio, {passive:true});
document.addEventListener("touchend", unlockAudio, {passive:true});
// 컨텍스트가 깨어난 뒤에 재생 — suspended 상태에서 예약하면 iOS에서 소리가 씹힌다
function withAudio(fn){
  const c=ac(); if(!c) return;
  if(c.state!=="running" && c.resume){ c.resume().then(()=>fn()).catch(()=>fn()); }
  else fn();
}
function flashPlaying(){
  const b=document.querySelector(".testbtn"); if(!b) return;
  const old=b.textContent; b.textContent="🔊 재생 중…"; b.disabled=true;

}
function tone(freq, t0, dur, vol){
  const c=ac(); if(!c) return;
  const o=c.createOscillator(), g=c.createGain();
  o.type="triangle"; o.frequency.value=freq;
  g.gain.setValueAtTime(0, c.currentTime+t0);
  g.gain.linearRampToValueAtTime(vol||.25, c.currentTime+t0+.02);
  g.gain.setValueAtTime(vol||.25, c.currentTime+t0+dur-.06);
  g.gain.linearRampToValueAtTime(0, c.currentTime+t0+dur);
  o.connect(g); g.connect(c.destination);
  o.start(c.currentTime+t0); o.stop(c.currentTime+t0+dur+.02);
}
function click(t0){ const c=ac(); if(!c) return; const o=c.createOscillator(), g=c.createGain();
  o.type="square"; o.frequency.value=1200; g.gain.setValueAtTime(.15,c.currentTime+t0);
  g.gain.exponentialRampToValueAtTime(.001,c.currentTime+t0+.06);
  o.connect(g); g.connect(c.destination); o.start(c.currentTime+t0); o.stop(c.currentTime+t0+.08); }

function pick(i){
  const q = APP._q, opts = APP._opts;
  if(q.multi){
    const el = document.querySelector(`.opt[data-i="${i}"]`);
    const o = opts[i];
    if(o.exclusive){

      APP._sel.add(i); el.classList.add("sel");
    } else {
      opts.forEach((oo,j)=>{ if(oo.exclusive && APP._sel.has(j)){ APP._sel.delete(j); document.querySelector(`.opt[data-i="${j}"]`).classList.remove("sel"); }});
      if(APP._sel.has(i)){ APP._sel.delete(i); el.classList.remove("sel"); }
      else { APP._sel.add(i); el.classList.add("sel"); }
    }
  } else {
    snap();

/* ============ 결과 링크 공유 (비트 단위 초압축) ============
   질문 순서와 선택지 개수가 코드에 고정돼 있으므로, 질문 id도 "미응답" 표시도 실을 필요가 없다.
   조건부 질문(when)은 디코드 때 상태를 재생하며 그대로 판정되므로 비트를 소비하지 않는다.
   → 질문마다 필요한 최소 비트(2지선다=1비트)만 담아 약 25자.
   앞머리에 테스트 점수를 먼저 넣는다(A7의 when이 pitch에 의존하므로 순서가 중요).   */
const B64="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_";
const bitsFor=n=>Math.max(1, Math.ceil(Math.log2(Math.max(2,n))));
function BitW(){ this.b=[]; }
BitW.prototype.put=function(v,n){ v=v|0; for(let i=n-1;i>=0;i--) this.b.push((v>>i)&1); };
BitW.prototype.str=function(){ let s=""; for(let i=0;i<this.b.length;i+=6){ let v=0; for(let j=0;j<6;j++) v=(v<<1)|(this.b[i+j]||0); s+=B64[v]; } return s; };
function BitR(s){ this.b=[]; for(const ch of s){ const v=B64.indexOf(ch); if(v<0) continue; for(let i=5;i>=0;i--) this.b.push((v>>i)&1); } this.i=0; }
BitR.prototype.get=function(n){ let v=0; for(let k=0;k<n;k++) v=(v<<1)|(this.b[this.i++]||0); return v; };
function maskToArr(m){ const a=[]; for(let i=0;i<16;i++) if(m&(1<<i)) a.push(i); return a; }
function applyPick(q, v){
  const opts=q.dynOpts?q.dynOpts():q.opts; if(!opts) return;
  if(Array.isArray(v)) v.forEach(i=>{ const o=opts[i]; if(o&&!o.exclusive&&o.fx) o.fx(); });
  else { const o=opts[v]; if(o&&o.fx) o.fx(); }
  q.after&&q.after();
}
// 인코드·디코드가 완전히 같은 순서로 상태를 재생하도록 공통 루프를 쓴다
function walkQs(step){
  Q.forEach(q=>{
    if(q.type) return;
    if(q.when && !q.when()) return;
    const opts=q.dynOpts?q.dynOpts():q.opts;
    if(!opts||!opts.length) return;
    step(q, opts);
  });
}
function packAnswers(){
  const picks={}; (P.trail||[]).forEach(([id,v])=>{ picks[id]=v; });
  const keep=P, pitch=P.pitch, rhythm=P.rhythm, abs=P.abs||0;
  const w=new BitW();
  w.put(pitch==null?0:1,1); if(pitch!=null) w.put(Math.max(0,Math.min(100,Math.round(pitch))),7);
  w.put(rhythm==null?0:1,1); if(rhythm!=null) w.put(Math.max(0,Math.min(100,Math.round(rhythm))),7);
  w.put(abs,4);
  resetP(); P.pitch=pitch; P.rhythm=rhythm; P.abs=abs;
  walkQs((q,opts)=>{
    const v=picks[q.id];
    if(q.multi){
      const mask=(Array.isArray(v)?v:(v==null?[]:[v])).reduce((a,i)=>a|(1<<i),0);
      w.put(mask, opts.length); applyPick(q, maskToArr(mask));
    } else {
      const idx=(v==null||v>=opts.length)?0:v;
      w.put(idx, bitsFor(opts.length)); applyPick(q, idx);
    }
  });
  P=keep;
  return w.str();
}
function unpackAnswers(s){
  const r=new BitR(s);
  resetP();
  P.pitch  = r.get(1) ? r.get(7) : null;
  P.rhythm = r.get(1) ? r.get(7) : null;
  P.abs    = r.get(4);
  walkQs((q,opts)=>{
    if(q.multi) applyPick(q, maskToArr(r.get(opts.length)));
    else applyPick(q, r.get(bitsFor(opts.length)));
  });
}

function loadShared(){
  const h=location.hash;
  if(h.length<2) return false;
  try{
    if(h.startsWith("#s=")){                       // 1세대(JSON) 링크 호환
      const b=h.slice(3).replace(/-/g,"+").replace(/_/g,"/");
      const payload=JSON.parse(decodeURIComponent(escape(atob(b))));
      resetP();
      (payload.t||[]).forEach(pair=>{ const q=Q.find(x=>x.id===pair[0]); if(q) applyPick(q, pair[1]); });
      if(payload.p!=null) P.pitch=payload.p;
      if(payload.r!=null) P.rhythm=payload.r;
      P.abs=payload.a||0;
    } else if(h.startsWith("#r=")){                // 2세대(글자 단위) 링크 호환
      const s=h.slice(3); let i=0;
      const d1=ch=>B64.indexOf(ch);
      resetP();
      Q.forEach(q=>{
        if(q.type) return;
        const ch=s[i++]; if(ch===undefined||ch===".") return;
        if(q.multi){ const lo=s[i++]; applyPick(q, maskToArr((d1(ch)<<6)|d1(lo))); }
        else applyPick(q, d1(ch));
      });
      const p=s[i++], rr=s[i++], a=s[i++];
      P.pitch = (p===undefined||p===".") ? null : d1(p)*2;
      P.rhythm= (rr===undefined||rr===".") ? null : d1(rr)*2;
      P.abs   = (a===undefined||a===".") ? 0 : d1(a);
    } else {                                        // 3세대(비트 단위) 링크
      unpackAnswers(h.slice(1));
    }
    showResult(true);
    return true;
  }catch(e){ return false; }
}

const T1_INTERVALS=[7,4,2,1,.5,.25], T2_CENTS=[100,50,25,15];
function startTests(){ ac(); snap(); testState={phase:"t1", trial:0, score:0, t2:0, t3:0, abs:0, taps:[], t1correct:0}; runT1(); }

function runT1(){
  const ts=testState;
  if(ts.trial>=T1_INTERVALS.length){ ts.phase="t2"; ts.trial=0; return runT2(); }
  const semi=T1_INTERVALS[ts.trial];
  const base=57+Math.floor(Math.random()*12); // A3~
  const firstHigher=Math.random()<.5;
  const f1=midi2f(firstHigher?base+semi:base), f2=midi2f(firstHigher?base:base+semi);
  ts.answer=firstHigher?0:1;
  render(`
    <div class="center">
      <span class="tag">귀 테스트 1/5 · 높낮이</span>
      <h2 class="qtitle">둘 중 어느 소리가 더 높나요?</h2>
      <p class="flavor">${ts.trial+1} / ${T1_INTERVALS.length} ${semi<1?"— 이제 좀 어렵습니다 😈":""}<br><span class="small">▶️ 몇 번이든 다시 들어도 돼요</span></p>
      <button class="testbtn" onclick="APP._playPair(${f1},${f2})">▶️ 듣기</button>
      <div class="pillrow" style="margin-top:16px">
        <button class="pill" onclick="APP._t1(0)">첫 번째</button>
        <button class="pill" onclick="APP._t1(1)">두 번째</button>
      </div>
    </div>`);
  setTimeout(()=>APP._playPair(f1,f2),300);
}
function _playPair(f1,f2){ flashPlaying(); withAudio(()=>{ tone(f1,0,.7); tone(f2,1.0,.7); }); }
function _t1(a){ const ts=testState; if(a===ts.answer){ts.score+=[5,8,12,15,20,25][ts.trial]; ts.t1correct++;} ts.trial++; runT1(); }

function runT2(){
  const ts=testState;
  if(ts.trial>=T2_CENTS.length){ ts.phase="t3"; ts.trial=0; return runT3(); }
  const cents=T2_CENTS[ts.trial];
  const base=60+Math.floor(Math.random()*10);
  const same=Math.random()<.5;
  const f1=midi2f(base), f2=same?f1:f1*Math.pow(2,cents/1200)*(Math.random()<.5?1:Math.pow(2,-2*cents/1200));
  ts.answer=same?0:1;
  render(`
    <div class="center">
      <span class="tag mint">귀 테스트 2/5 · 미세 음정</span>
      <h2 class="qtitle">두 소리, 같나요 다르나요?</h2>
      <p class="flavor">${ts.trial+1} / ${T2_CENTS.length} — 차이가 점점 미세해집니다<br><span class="small">▶️ 몇 번이든 다시 들어도 돼요</span></p>
      <button class="testbtn" onclick="APP._playPair(${f1},${f2})">▶️ 듣기</button>
      <div class="pillrow" style="margin-top:16px">
        <button class="pill" onclick="APP._t2(0)">같다</button>
        <button class="pill" onclick="APP._t2(1)">다르다</button>
      </div>
    </div>`);
  setTimeout(()=>APP._playPair(f1,f2),300);
}
function _t2(a){ const ts=testState; if(a===ts.answer) ts.score+=[5,10,15,15][ts.trial]; ts.trial++; runT2(); }

function runT3(){
  const ts=testState;
  if(ts.trial>=3){ ts.phase="abs"; ts.trial=0; return runAbs(); }
  const len=4, base=60+Math.floor(Math.random()*6);
  const mel=[base]; for(let i=1;i<len;i++) mel.push(mel[i-1]+[-4,-2,2,3,4][Math.floor(Math.random()*5)]);

const RPATTERNS=[
  {name:"기본 박자",        beats:[0,1,2,3],           max:10, hint:"쿵. 쿵. 쿵. 쿵. 이건 몸풀기예요."},
  {name:"8분음표",          beats:[0,1,1.5,2,3,3.5],   max:15, hint:"중간에 잰걸음이 섞입니다."},
  {name:"엇박(싱코페이션)", beats:[0,.75,1.5,2,3,3.5], max:20, hint:"살짝 밀리는 맛이 포인트."},
  {name:"타악 리듬(클라베)",beats:[0,.75,1.5,2.5,3],   max:25, hint:"쿠바 타악의 심장 박동."},
  {name:"폴리리듬 최종보스",beats:[0,.75,1,1.75,2.25,2.5,3.25,3.5], max:30, hint:"프로 타악 주자도 집중해야 하는 16비트 엇박. 틀려도 도전 자체가 자랑입니다."},
];
const RBEAT=667; // 90bpm
function runRhythm(){ const ts=testState; ts.rTrial=0; ts.rScore=0; ts.lastPct=null; runRhythmTrial(); }
function runRhythmTrial(){
  const ts=testState;
  if(ts.rTrial>=RPATTERNS.length){ return finishTests(); }
  const pat=RPATTERNS[ts.rTrial];
  render(`
    <div class="center">

      <h2 class="qtitle">${ts.rTrial+1}단계 — ${pat.name}</h2>
      <p class="flavor">${pat.hint}<br>리듬을 듣고, <b>조용해지면 그대로 따라 치세요.</b><br><span class="small">▶️는 몇 번이든 다시 들을 수 있어요 (다시 들으면 친 것은 초기화)</span></p>

      <div id="tapzone" onpointerdown="APP._rtap(event)" style="opacity:.45">먼저 들어보세요</div>
      <button class="btn mint" id="rdoneBtn" onclick="APP._rdone()" style="display:none">다 쳤어요 ✓</button>
    </div>`);
}
function _playRhythm(){
  const ts=testState, pat=RPATTERNS[ts.rTrial];
  ts.rTaps=[]; ts.rReady=false; clearTimeout(ts.rTimer);
  withAudio(()=>pat.beats.forEach(b=>click(b*RBEAT/1000)));
  const dur=(pat.beats[pat.beats.length-1])*RBEAT+500;
  setTimeout(()=>{ ts.rReady=true; const z=document.getElementById("tapzone"); if(z){ z.style.opacity=1; z.textContent="따라 치세요!"; } const d=document.getElementById("rdoneBtn"); if(d) d.style.display="block"; }, dur);
}
function _rtap(ev){
  if(ev&&ev.preventDefault) ev.preventDefault();
  const ts=testState; if(!ts.rReady) return;
  ts.rTaps.push(performance.now());
  const z=document.getElementById("tapzone"); z.textContent=["🥁","👏","🎶","✨"][ts.rTaps.length%4];
  clearTimeout(ts.rTimer);
  const pat=RPATTERNS[ts.rTrial];
  if(ts.rTaps.length>=pat.beats.length) ts.rTimer=setTimeout(()=>_rdone(), 900);
  else ts.rTimer=setTimeout(()=>_rdone(), pat.beats[pat.beats.length-1]*RBEAT+1800);
}
function evalRhythmTaps(taps, trialIdx){
  const pat=RPATTERNS[trialIdx];
  if(!taps||taps.length<2) return 0;
  const e=pat.beats.map(b=>b*RBEAT);
  const t0=taps[0], t=taps.map(x=>x-t0);
  const n=Math.min(t.length, e.length);
  let s=1;
  if(t[n-1]>200){ s=e[n-1]/t[n-1]; s=Math.max(.7,Math.min(1.4,s)); }
  let sum=0; for(let i=0;i<n;i++) sum+=Math.abs(t[i]*s-e[i]);
  const acc=Math.max(0,1-(sum/n)/300);
  const cnt=Math.max(0,1-Math.abs(t.length-e.length)*.25);
  return acc*cnt;
}
function _rdone(){
  const ts=testState; clearTimeout(ts.rTimer);
  if(!ts.rReady) return;
  const ratio=evalRhythmTaps(ts.rTaps, ts.rTrial);
  ts.lastPct=Math.round(ratio*100);
  ts.rScore+=RPATTERNS[ts.rTrial].max*ratio;
  ts.rTrial++; runRhythmTrial();
}
function finishTests(){
  const ts=testState;
  P.rhythm=Math.max(5, Math.min(100, Math.round(ts.rScore)));
  P.pitch=Math.min(100, Math.round(ts.score/145*100));

  render(`

        <p>🥁 <b>리듬 점수: ${P.rhythm}점</b> / 100 ${P.rhythm>=70?"— 몸에 메트로놈 내장하셨네요":""}</p>
        <p>🏅 절대음감 테스트: ${ts.abs}점 / 8 — ${absMsg}</p>
      </div>
      <p class="small">🎉 여기까지가 전체의 절반! 이제 취향 문답만 남았어요.</p>
      <button class="btn" onclick="APP.next()">계속 →</button>

}

/* ============ 스코어링 엔진 ============ */
function g(o,path,dflt){ try{ return path.split(".").reduce((a,k)=>a[k], o) ?? dflt; }catch(e){ return dflt; } }
const BUDGET_CAP = {1:300000, 2:800000, 3:3500000, 4:Infinity};

function famKeys(inst){
  const hay = (inst.family||"")+" "+inst.name+" "+JSON.stringify(g(inst,"kinship.easyFrom",[]));
  return Object.keys(FAM_MATCH).filter(k=>FAM_MATCH[k].test(inst.family||"")||FAM_MATCH[k].test(inst.name||""));
}

// 장난·이색 악기 감쇠: 1위 자리는 진지한 악기에게, 이 친구들은 와일드카드로
const NOVELTY={kazoo:32, jaw_harp:28, otamatone:18, glass_harp:26, musical_saw:12, toy_piano:16};
// 처음부터 사는 악기가 아님 — 학원·교회·연습실·단체 악기로 배우기 시작하는 악기들 (예산 게이트 면제)
const INSTITUTIONAL=new Set(["pipe_organ","celesta","timpani","marimba","vibraphone","tubular_bells","handbell","concert_harp","drum_set","tuba","sousaphone","double_bass","harpsichord","piano","hammond_organ"]);
function scoreSlot(slot){
  const inst=slot.inst, why=[], warn=[];
  let s=50, gate=null, variantNote=null;
  const nov=NOVELTY[inst.id]; if(nov) s-=Math.round(nov*(P.rarityPref>=3?0.4:1));
  const B=inst.body||{}, PR=inst.practical||{}, V=inst.vibe||{}, PL=inst.play||{}, C=inst.cost||{};
  const noiseV = PR.noise||3;
  const hasQuietVariant = (inst.variants||[]).some(v=>g(v,"mods.noise",9)<=2) ;

  // ---- 게이트 ----
  if(P.no.saliva && (B.saliva||0)>=1){
    if(hasQuietVariant===false || P.elec===0) gate="침이 생기는 악기 (감당 불가 선택)";
  }
  if(!gate && (P.no.callus||P.handJob===2) && (B.callus||0)>=2) gate="손끝 굳은살·통증 (감당 불가 선택)";
  if(!gate && P.handJob===2 && (B.callus||0)>=1) gate="손끝을 보호해야 하는 직업";
  if(!gate && P.no.embouchure && (B.embouchure||0)>=2) gate="입술 부담 (감당 불가 선택)";
  if(!gate && P.no.heavy && (B.weight||1)>=4 && P.carry!==4) gate="무거운 운반 (감당 불가 선택)";
  if(!gate && P.no.posture && JSON.stringify(B.postureRisk||[]).includes("목")) gate="목·어깨 비트는 자세 (감당 불가 선택)";
  if(!gate && P.no.maint && (PR.maintenance||1)>=4) gate="소모품 손질 (감당 불가 선택)";
  if(!gate && P.breath===0 && (B.breath||0)>=3) gate="큰 폐활량 필요";
  if(!gate && (C.entryKRW&&C.entryKRW[0]||0) > BUDGET_CAP[P.budget]){
    if(INSTITUTIONAL.has(inst.id)){ variantNote = variantNote || "🏫 이 악기는 처음부터 사는 게 아니에요 — 학원·교회·연습실·합주단의 악기로 배우기 시작하면 됩니다"; }
    else gate=`입문 가격이 예산 초과 (약 ${Math.round((C.entryKRW[0])/10000)}만원~)`;
  }
  if(!gate && P.learn==="lesson" && P.lessonEnv===2 && (PR.lessonKR||3)<=1) gate="동네에서 레슨을 못 구하는 악기";
  if(!gate && P.noiseEnv===1 && noiseV>=4){
    if(hasQuietVariant && P.elec>=1){ variantNote="🔇 소음 문제는 전자·약음 버전으로 해결하는 조건!"; s-=3; }
    else gate="야간 아파트에서 불가능한 소음";
  }
  if(!gate && P.carry===1 && (PR.portability||3)<=2) gate="주머니 사이즈를 원하셨는데 대형 악기";

  // ---- 청음 적합 (핵심 축) ----
  const pf = PL.pitchFixed||"F1";
  const ps = P.pitch==null?50:P.pitch;
  const band = ps>=65?2:(ps>=35?1:0);
  const pitchTable = { F0:[15,10,2], F1:[2,10,8], F2:[-10,6,15], F3:[-28,-4,25], P:[0,0,0] };
  const pAdd = (pitchTable[pf]||pitchTable.F1)[band];
  s+=pAdd;
  if(pf==="F3"&&band===2) why.push({t:`청음 ${ps}점 — 프렛도 건반도 없는 곳에서 음정을 스스로 만들 수 있는 귀예요`, p:pAdd});
  if(pf==="F0"&&band===0) why.push({t:`음정을 악기가 잡아줘요. 청음 점수 부담 제로!`, p:pAdd});
  if(pf==="P"&&band===0&&(P.rhythm||0)>=60){ s+=18; why.push({t:"음정 걱정 없이 리듬으로 승부하는 포지션 — 당신의 리듬 점수가 아깝지 않게", p:18}); }
  if(P.abs>=6 && (pf==="F3"||/테레민|뮤지컬 쏘|톱|팀파니/.test(inst.name))){ s+=10; why.push({t:`절대음감 ${P.abs}/8점 — 이 악기에선 초능력입니다`, p:10}); }

  // ---- 리듬 ----
  const roles=(PL.roles||[]).join(" ");
  if((P.rhythm||50)>=70 && /리듬|베이스/.test(roles)){ s+=14; why.push({t:`리듬 ${P.rhythm}점 — 박자를 책임지는 역할에 딱`, p:14}); }
  if((P.rhythm||50)<35 && /리듬/.test(roles)) s-=10;
  if((P.rhythm||50)>=70 && (PL.fastPlay||3)>=4) s+=4;

  // ---- 장르 ----
  let gpts=0; const gm=[];
  slot.genres.main.forEach(gn=>{ if(P.genres[gn]){ gpts+=P.genres[gn]*7; gm.push(gn); } });
  slot.genres.sub.forEach(gn=>{ if(P.genres[gn]){ gpts+=P.genres[gn]*3.5; } });
  gpts=Math.min(gpts,45); s+=gpts;
  if(gm.length) why.push({t:`고른 취향(${gm.join("·")})과 정면으로 겹칩니다`, p:gpts});

  // ---- 역할 ----
  if(P.role){
    const roleMap={"멜로디":/멜로디/,"화음":/화음|반주/,"리듬":/리듬/,"베이스":/베이스/,"올라운드":/올라운드/};
    if(roleMap[P.role] && roleMap[P.role].test(roles)){ s+=12; why.push({t:`"${P.role}" 역할 지망과 일치`, p:12}); }
  }
  // ---- 음색 ----
  const toneMatch=(g(inst,"sound.tone",[])).filter(t=>P.tones.includes(t));
  if(toneMatch.length){ const tp=Math.min(toneMatch.length*6,18); s+=tp; why.push({t:`끌린다고 한 소리(${toneMatch.slice(0,2).join("·")})가 이 악기의 목소리`, p:tp}); }

  // ---- 희귀도·유행 ----
  const rar=V.rarityKR||3;
  if(P.rarityPref>=3){ const rp=(rar-2)*7; s+=rp; if(rar>=4) why.push({t:`희귀도 ${rar}/5 — "나만 쓰는 악기"의 희열 보장`, p:rp}); }
  else if(P.rarityPref<=1){ s+=(3-rar)*5; if(rar>=4){ s-=8; } }
  if(P.trendPref===1 && (V.trendy||3)<=2){ s+=6; }
  if(P.trendPref===3 && (V.trendy||3)>=4){ s+=6; }

  // ---- 즉흥·무대 ----
  if(P.improvPref===3 && (PL.improv||2)>=4){ s+=8; why.push({t:"즉흥으로 노는 문화가 살아있는 악기", p:8}); }
  if(P.improvPref===1 && (PL.improv||2)<=2) s+=5;
  if(P.showPref>=3 && (V.showOff||2)>=4){ s+=8; why.push({t:"무대 장악용으로 검증된 악기", p:8}); }
  if(P.showPref<=1 && (V.showOff||2)<=2) s+=5;

  // ---- 인내 vs 즉각보상 ----
  const eb=PR.entryBarrier||3, qr=PR.quickReward||3;
  if(P.patience===1){ s+=(qr-3)*6-(Math.max(0,eb-3))*7; if(qr>=4) why.push({t:"한 달 안에 곡 하나 뽑히는 속성 보상형", p:(qr-3)*6}); }
  if(P.patience===3 && eb>=4){ s+=7; why.push({t:"몇 년짜리 프로젝트를 원하셨죠? 마침 그런 악기입니다", p:7}); }
  if(P.daily===1 && eb>=4) s-=8;
  if(P.repeatOk===0 && eb>=4) s-=6;

  // ---- 학습 환경 ----
  if(P.learn!=="lesson"){ const sl=PR.selfLearn||3; if(sl>=4){s+=6;} else if(sl<=2){s-=8; warn.push("독학 자료가 부족한 악기 — 커뮤니티부터 찾으세요");} }
  else { if((PR.lessonKR||3)>=4){ s+=5; why.push({t:"레슨 선생님 구하기 쉬움 (전국 어디나)", p:5}); } }

  // ---- 환경 적합 보너스 ----
  if(P.noiseEnv===1 && noiseV<=2){ s+=8; why.push({t:"야간 아파트에서도 눈치 안 보이는 음량", p:8}); }
  if(P.goal==="버스킹" && (PR.portability||3)>=4) s+=6;

  // ---- 목표·합주 ----
  const ens=(inst.ensemble||[]).join(" ");
  if(P.goal==="밴드" && /밴드/.test(ens)){ s+=10; why.push({t:"밴드 자리가 실제로 있는 악기", p:10}); }
  if(P.goal==="오케" && /오케스트라|관현악|윈드/.test(ens)){ s+=12; why.push({t:"합주단 입단 루트 있음", p:12}); }
  if(P.goal==="작곡" && /건반|전자|특수/.test(inst.family||"")){ s+=8; }
  if(P.goal==="힐링" && ((V.tags||[]).includes("명상적")||slot.genres.main.includes("명상·사운드힐링"))){ s+=8; }
  if(P.social==="big" && /오케스트라|밴드|앙상블|합주/.test(ens)) s+=4;
  if(P.social==="solo" && /독주|솔로/.test(roles+ens+(inst.desc||""))) s+=3;

  // ---- 노래 반주 ----
  if(P.sing===2 && PL.singAlong===true){ s+=12; why.push({t:"샤워장 열창러에게: 노래하면서 칠 수 있는 악기입니다", p:12}); }
  if(P.sing===2 && P.goal==="버스킹" && PL.singAlong===true) s+=5;

  // ---- 경험·친족 ----
  if(P.expFams.length){
    const easy=(g(inst,"kinship.easyFrom",[])).join(" ");

    let kin=0;
    P.expFams.forEach(f=>{
      const label=FAM_OPTS.find(x=>x.k===f).t;

    });

  if(P.calm>=2 && slot.genres.main.includes("명상·사운드힐링")){ s+=6; }

  // ---- 통증·신체 ----
  if(P.pain.includes("목") && JSON.stringify(B.postureRisk||[]).includes("목")){ s-=22; warn.push("목·어깨 통증에 부담되는 자세"); }
  if(P.pain.includes("허리") && ((B.weight||1)>=4||JSON.stringify(B.postureRisk||[]).includes("허리"))){ s-=15; warn.push("허리에 부담 가능"); }

  if(P.hand===3 && /콘트라|더블베이스|튜바|바리톤/.test(inst.name)) s+=3;
  if(P.physical===0 && (B.weight||1)>=4) s-=4;
  if(P.physical===2 && /드럼|타악/.test(inst.family||"")) s+=4;
  if(P.braces && (B.embouchure||0)>=2){ s-=15; warn.push("치아 교정 중엔 마우스피스가 고생 — 교정 후 재도전 추천"); }
  if(P.nails===1 && /건반|피아노/.test(inst.family||"")) warn.push("긴 손톱과 건반은 앙숙입니다");

  if(P.no.ugly && (pf==="F3"||(B.embouchure||0)>=2)) s-=8;

  return {slot, score:Math.round(s), gate, why, warn, variantNote};
}

function wrapText(x, text, cx, y, maxW, lh, maxLines){
  const words=String(text).split(/\s+/); const lines=[]; let cur="";
  words.forEach(w=>{ const t=cur?cur+" "+w:w; if(x.measureText(t).width>maxW && cur){ lines.push(cur); cur=w; } else cur=t; });
  if(cur) lines.push(cur);
  const use=lines.slice(0,maxLines);
  if(lines.length>maxLines) use[maxLines-1]=use[maxLines-1].replace(/[.,·]?$/,"…");
  use.forEach((l,i)=>x.fillText(l, cx, y+i*lh));
  return y+use.length*lh;
}

  const base=parts[0], track=parts.slice(1).join(" · ");
  x.fillStyle="#8A7A6E"; x.font="34px Jua"; x.fillText("내 악기는 🎵", W/2, 968);
  x.fillStyle="#4A3B32"; x.font=(base.length>11?"64px Jua":"82px Jua");
  x.fillText(base.length>17?base.slice(0,17)+"…":base, W/2, 1052);
  let ny=1052;
  if(track){
    x.font="32px Jua";
    const tw=Math.min(880, x.measureText(track).width+56);
    x.fillStyle="#E5F7F1"; rr(W/2-tw/2, ny+26, tw, 62, 31); x.fill();
    x.fillStyle="#3EA98F"; x.fillText(track.length>22?track.slice(0,22)+"…":track, W/2, ny+68);
    ny+=88;
  }
  // 한 줄 소개
  x.fillStyle="#8A7A6E"; x.font="34px 'Gowun Dodum'";
  ny=wrapText(x, (g(inst,"sound.toneDesc","")||"").replace(/^"|"$/g,""), W/2, ny+70, 820, 48, track?2:3);
  // 점수 배지
  ny+=42;
  if(P.pitch!=null){
    x.font="36px Jua";
    const line=`👂 청음 ${P.pitch}   🥁 리듬 ${P.rhythm}`+(P.abs>=6?"   🏅 절대음감":"");
    const bw=Math.min(900, x.measureText(line).width+70);
    x.fillStyle="#FFF0EA"; rr(W/2-bw/2, ny-46, bw, 72, 36); x.fill();
    x.fillStyle="#E85F47"; x.fillText(line, W/2, ny);
    ny+=92;
  }
  // 희귀도
  const rp=RAR_TABLE[inst.id];
  x.font="36px Jua";
  const rtxt = rp==null ? "🦄 아무도 못 받아본 유니콘 결과" : (rp<=1.5?`💎 상위 ${rp}%만 나오는 결과`:(rp<=4?`🌟 흔치 않은 결과 (약 ${rp}%)`:`🍀 같은 결과 약 ${rp}%`));
  const rw=Math.min(900, x.measureText(rtxt).width+70);
  x.fillStyle="#FFF4D6"; rr(W/2-rw/2, ny-46, rw, 72, 36); x.fill();
  x.fillStyle="#B8860B"; x.fillText(rtxt, W/2, ny);
  // 하단 CTA + 워터마크
  x.fillStyle="#8A7A6E"; x.font="36px 'Gowun Dodum'"; x.fillText("당신에게 맞는 악기는 뭘까요?", W/2, 1642);
  x.fillStyle="#FF7E67"; rr(W/2-330, 1686, 660, 96, 48); x.fill();
  x.fillStyle="#fff"; x.font="44px Jua"; x.fillText("instrumentquiz.org", W/2, 1749);
  x.fillStyle="#8A7A6E"; x.font="30px 'Gowun Dodum'"; x.fillText("3분 테스트 · 악기 189종", W/2, 1826);
  return c.toDataURL("image/png");
}
async function shareCard(){
  const btn=document.getElementById("shareBtn");
  const label=btn?btn.textContent:"";
  if(btn){ btn.disabled=true; btn.textContent="🎨 카드 만드는 중…"; }
  let dataUrl=null;
  try{ dataUrl=await buildCard(); }catch(e){}
  if(btn){ btn.disabled=false; btn.textContent=label; }
  if(!dataUrl) return;
  try{
    const blob=await (await fetch(dataUrl)).blob();
    const file=new File([blob], "my-instrument.png", {type:"image/png"});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:"나의 운명의 악기", text:"나한테 맞는 악기 찾았어요 🎵 "+resultLink()});
      return;
    }
  }catch(e){ /* 공유 취소·미지원 → 모달 폴백 */ }
  showImgModal(dataUrl); // 인앱 브라우저에서 페이지가 날아가지 않도록 다운로드 대신 모달
}

      <button class="btn big" onclick="APP.start()">🎵 나도 테스트 해보기<br><span style="font-size:.8rem;opacity:.9">3분이면 끝나요</span></button>
    </div>`:""}

      <h1 style="font-size:1.5rem; margin:10px 0 4px">🔮 운명의 악기가 정해졌습니다</h1>
      <div>${pitchTag}${rhyTag}${absBadge}</div>

    ${mateHtml}

    ${shared?`
    <div class="card" style="background:#FFF0EA; text-align:center">

      <p class="small" style="margin:0 0 12px">귀 테스트 + 취향 문답으로 악기 189종 중에서 찾아드려요</p>
      <button class="btn big" onclick="APP.start()">🎵 나도 테스트 해보기<br><span style="font-size:.8rem;opacity:.9">3분이면 끝나요 · 무료</span></button>

      <p class="small" style="margin:0 0 12px">친구는 어떤 악기가 나올지도 궁금하잖아요</p>
      <button class="btn big" id="shareBtn" onclick="APP.shareCard()">📸 인스타 스토리에 자랑하기</button>
      <button class="btn mint" style="margin-top:10px" onclick="APP.copyLink()">🔗 친구에게 내 악기 공유하기</button>

function share(){
  const R=APP._R; if(!R)return;
  const lines=[
    "🎵 살면서 악기 하나쯤은 다룰 줄 알아야지 — 내 결과",
    `👑 운명의 악기: ${R.top1.slot.dispName}`,
    ...(R.cands.map((c,i)=>`${i+2}위: ${c.slot.dispName}`)),
    P.pitch!=null?`👂 청음 ${P.pitch}점 / 🥁 리듬 ${P.rhythm}점${P.abs>=6?" / 🏅 절대음감 가능성":""}`:"",
    "내 결과 그대로 보기: "+resultLink()
  ].filter(Boolean);
  navigator.clipboard.writeText(lines.join("\n")).then(()=>alert("복사 완료! 어디든 붙여넣어 자랑하세요 🎉"));
}

/* ============ 배경 낙서 배치 (실물 일러스트 우선, 없으면 기본 낙서) ============ */
(function doodles(){
  const box=document.getElementById("doodles");
  const wishNames=[/^어쿠스틱 기타/,/^바이올린$/,/^트럼펫$/,/^드럼 세트/,/^피아노$/,/색소폰/,/^피아노 아코디언/,/^우쿨렐레$/,/^플루트$/,/^첼로$/,/^밴조$/,/^하모니카|다이어토닉 하모니카/];
  const artIds=[];
  wishNames.forEach(rx=>{ const hit=ALL.find(inst=>rx.test(inst.name)&&ART[inst.id]); if(hit) artIds.push(hit.id); });
  const fallback=["d-guitar","d-violin","d-trumpet","d-note","d-drum","d-piano","d-accordion","d-sax"];
  const N=16; let html="";
  for(let i=0;i<N;i++){
    const x=(i%4)*25+Math.random()*14, y=Math.floor(i/4)*25+Math.random()*12;
    const rot=Math.round(Math.random()*50-25), sz=54+Math.random()*40;
    if(artIds.length){
      const id=artIds[i%artIds.length];
      html+=`<span class="doodle artbox" style="left:${x}%;top:${y}%;width:${sz}px;height:${sz}px;transform:rotate(${rot}deg)">${ART[id]}</span>`;
    } else {
      const id=fallback[i%fallback.length];
      html+=`<svg class="doodle" style="left:${x}%;top:${y}%;transform:rotate(${rot}deg)" width="${sz}" height="${sz}" viewBox="0 0 100 100"><use href="#${id}"/></svg>`;
    }
  }
  box.innerHTML=html;
})();

/* ============ 공개 API ============ */
window.APP={
  start(){ toRoot(); resetP(); hist=[]; stepIdx=0; showQ(); },
  restart(){ toRoot(); showIntro(); },
  back:goBack, copyLink, _link:resultLink, _loadShared:loadShared, _buildCard:buildCard, _access:accessInfo,
  pick, next, startTests, skipTests,
  _playPair, _t1, _t2, _t3, _playMel, _playAbs, _abs, _playRhythm, _rtap, _rdone, _evalRhythm:evalRhythmTaps,
  share, shareCard,
  // 시뮬레이션: 랜덤 프로필 n명을 엔진에 통과시켜 1위 악기 분포 집계 (희귀도 테이블용)
  _mc(n){
    const cnt={};
    for(let k=0;k<n;k++){
      resetP(); P.pitch=Math.floor(Math.random()*100); P.rhythm=Math.floor(Math.random()*100); P.abs=Math.floor(Math.random()*9);
      activeQs().forEach(q=>{ if(q.type)return; const opts=q.dynOpts?q.dynOpts():q.opts; if(!opts||!opts.length)return;
        if(q.multi){ const m=1+Math.floor(Math.random()*Math.min(3,opts.length)); const st=new Set(); while(st.size<m) st.add(Math.floor(Math.random()*opts.length)); [...st].forEach(i=>{ if(!opts[i].exclusive) opts[i].fx&&opts[i].fx(); }); }
        else { const i=Math.floor(Math.random()*opts.length); opts[i].fx&&opts[i].fx(); }
        q.after&&q.after(); });
      const r=buildResult();
      if(r.top1){ const id=r.top1.slot.inst.id; cnt[id]=(cnt[id]||0)+1; }
    }
    return cnt;
  },
  // 디버그: 랜덤 답변으로 결과까지 자동 진행 (테스트는 스킵)
  _auto(){ resetP(); P.pitch=Math.floor(Math.random()*100); P.rhythm=Math.floor(Math.random()*100); P.abs=Math.floor(Math.random()*9);
    activeQs().forEach(q=>{ if(q.type)return; const opts=q.dynOpts?q.dynOpts():q.opts; if(!opts||!opts.length)return;
      if(q.multi){ const n=1+Math.floor(Math.random()*Math.min(3,opts.length)); const idx=new Set(); while(idx.size<n) idx.add(Math.floor(Math.random()*opts.length)); [...idx].forEach(i=>{ if(!opts[i].exclusive) opts[i].fx&&opts[i].fx(); }); }
      else { const i=Math.floor(Math.random()*opts.length); opts[i].fx&&opts[i].fx(); } });
    showResult(); return APP._R; },
  _slots: SLOTS, _profile:()=>P, _score:scoreSlot, _build:buildResult
};
resetP();
if(!loadShared()) showIntro();
window.addEventListener("hashchange", ()=>{ if(location.hash.length>1) loadShared(); });
})();
