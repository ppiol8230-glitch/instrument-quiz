name: Build signed iOS IPA

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: User-visible version name
        required: true
        default: "1.0"
      build_number:
        description: App Store build number (increase for every upload)
        required: true
        default: "1"
      upload_to_app_store:
        description: Validate and upload the signed IPA to App Store Connect
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      TEAM_ID: 5YUGKDDG9Q
      BUNDLE_ID: org.instrumentquiz.app
      IOS_SCHEME: App
      IOS_PROJECT: ios/App/App.xcodeproj
      VERSION_NAME: ${{ inputs.version_name }}
      BUILD_NUMBER: ${{ inputs.build_number }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund

      - name: Generate Capacitor iOS project
        shell: bash
        run: |
          set -euo pipefail
          npm run mobile:prepare
          npx cap add ios
          npm run ios:assets

      - name: Declare App Store encryption usage
        shell: bash
        run: |
          set -euo pipefail
          INFO_PLIST="ios/App/App/Info.plist"
          if ! /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$INFO_PLIST"; then
            /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$INFO_PLIST"
          fi

          /usr/libexec/PlistBuddy -c "Delete :CFBundleLocalizations" "$INFO_PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleLocalizations array" "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleLocalizations:0 string ko" "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleLocalizations:1 string en" "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleLocalizations:2 string zh-Hans" "$INFO_PLIST"
          node scripts/configure-ios-localizations.mjs ios/App

      - name: Install signing certificate and provisioning profile
        id: signing
        shell: bash
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          missing=0
          for secret_name in \
            IOS_DISTRIBUTION_P12_BASE64 \
            IOS_DISTRIBUTION_P12_PASSWORD \
            IOS_PROVISIONING_PROFILE_BASE64; do
            if [[ -z "${!secret_name:-}" ]]; then
              echo "Missing required secret: $secret_name" >&2
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

          CERTIFICATE_PATH="$RUNNER_TEMP/ios-distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/ios-provisioning.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/ios-provisioning.plist"
          KEYCHAIN_PATH="$RUNNER_TEMP/instrumentquiz-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"

          printf '%s' "$IOS_DISTRIBUTION_P12_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          chmod 600 "$CERTIFICATE_PATH" "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$IOS_DISTRIBUTION_P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST")"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PROFILE_PLIST")"
          if [[ -z "$PROFILE_UUID" || -z "$PROFILE_NAME" ]]; then
            echo "Could not read UUID and Name from the iOS provisioning profile." >&2
            exit 1
          fi
          if [[ ! "$PROFILE_UUID" =~ ^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$ ]]; then
            echo "The iOS provisioning profile contains an invalid UUID." >&2
            exit 1
          fi

          INSTALLED_PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          INSTALLED_PROFILE_PATH="$INSTALLED_PROFILE_DIR/$PROFILE_UUID.mobileprovision"
          mkdir -p "$INSTALLED_PROFILE_DIR"
          printf '%s\n' "$INSTALLED_PROFILE_PATH" > "$RUNNER_TEMP/installed-profile-path.txt"
          install -m 600 "$PROFILE_PATH" "$INSTALLED_PROFILE_PATH"
          printf 'profile_name=%s\n' "$PROFILE_NAME" >> "$GITHUB_OUTPUT"

      - name: Archive iPhone app
        shell: bash
        env:
          PROFILE_NAME: ${{ steps.signing.outputs.profile_name }}
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project "$IOS_PROJECT" \
            -scheme "$IOS_SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            MARKETING_VERSION="$VERSION_NAME" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            TARGETED_DEVICE_FAMILY=1 \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME"

      - name: Create App Store export options
        shell: bash
        env:
          PROFILE_NAME: ${{ steps.signing.outputs.profile_name }}
        run: |
          set -euo pipefail
          EXPORT_OPTIONS="$RUNNER_TEMP/ExportOptions.plist"
          cat > "$EXPORT_OPTIONS" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>5YUGKDDG9Q</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict/>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST
          /usr/libexec/PlistBuddy \
            -c "Add :provisioningProfiles:$BUNDLE_ID string $PROFILE_NAME" \
            "$EXPORT_OPTIONS"

      - name: Export signed IPA
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/ios-export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Stage IPA artifact
        shell: bash
        run: |
          set -euo pipefail
          IPA_PATH="$(find "$RUNNER_TEMP/ios-export" -maxdepth 1 -type f -name '*.ipa' -print -quit)"
          if [[ -z "$IPA_PATH" ]]; then
            echo "No IPA was produced by xcodebuild -exportArchive." >&2
            exit 1
          fi
          mkdir -p release-artifacts
          install -m 600 "$IPA_PATH" release-artifacts/instrument-fit.ipa

      - name: Upload signed IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: instrument-fit-ios-${{ inputs.build_number }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 1

      - name: Prepare App Store Connect API key
        if: inputs.upload_to_app_store == true
        shell: bash
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          set -euo pipefail

          missing=0
          for secret_name in \
            APP_STORE_CONNECT_API_KEY_ID \
            APP_STORE_CONNECT_API_ISSUER_ID \
            APP_STORE_CONNECT_API_KEY_BASE64; do
            if [[ -z "${!secret_name:-}" ]]; then
              echo "Missing required App Store Connect secret: $secret_name" >&2
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi
          if [[ ! "$APP_STORE_CONNECT_API_KEY_ID" =~ ^[A-Za-z0-9]+$ ]]; then
            echo "APP_STORE_CONNECT_API_KEY_ID has an invalid format." >&2
            exit 1
          fi

          TEMP_KEY_DIR="$RUNNER_TEMP/private_keys"
          ALTOOL_KEY_DIR="$HOME/.appstoreconnect/private_keys"
          KEY_FILENAME="AuthKey_$APP_STORE_CONNECT_API_KEY_ID.p8"
          mkdir -p "$TEMP_KEY_DIR" "$ALTOOL_KEY_DIR"
          chmod 700 "$TEMP_KEY_DIR" "$HOME/.appstoreconnect" "$ALTOOL_KEY_DIR"
          printf '%s' "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > "$TEMP_KEY_DIR/$KEY_FILENAME"
          chmod 600 "$TEMP_KEY_DIR/$KEY_FILENAME"
          printf '%s\n' "$ALTOOL_KEY_DIR/$KEY_FILENAME" > "$RUNNER_TEMP/app-store-key-path.txt"
          install -m 600 "$TEMP_KEY_DIR/$KEY_FILENAME" "$ALTOOL_KEY_DIR/$KEY_FILENAME"

      - name: Validate IPA with App Store Connect
        if: inputs.upload_to_app_store == true
        shell: bash
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcrun altool --validate-app \
            --type ios \
            --file release-artifacts/instrument-fit.ipa \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_API_ISSUER_ID"

      - name: Upload IPA to App Store Connect
        if: inputs.upload_to_app_store == true
        shell: bash
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcrun altool --upload-app \
            --type ios \
            --file release-artifacts/instrument-fit.ipa \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_API_ISSUER_ID"

      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          KEYCHAIN_PATH="$RUNNER_TEMP/instrumentquiz-signing.keychain-db"
          if [[ -e "$KEYCHAIN_PATH" ]]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi

          if [[ -f "$RUNNER_TEMP/installed-profile-path.txt" ]]; then
            INSTALLED_PROFILE_PATH="$(head -n 1 "$RUNNER_TEMP/installed-profile-path.txt")"
            if [[ "$INSTALLED_PROFILE_PATH" == "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision ]]; then
              rm -f "$INSTALLED_PROFILE_PATH"
            fi
          fi

          if [[ -f "$RUNNER_TEMP/app-store-key-path.txt" ]]; then
            APP_STORE_KEY_PATH="$(head -n 1 "$RUNNER_TEMP/app-store-key-path.txt")"
            if [[ "$APP_STORE_KEY_PATH" == "$HOME/.appstoreconnect/private_keys/AuthKey_"*.p8 ]]; then
              rm -f "$APP_STORE_KEY_PATH"
            fi
          fi

          rm -f \
            "$RUNNER_TEMP/ios-distribution.p12" \
            "$RUNNER_TEMP/ios-provisioning.mobileprovision" \
            "$RUNNER_TEMP/ios-provisioning.plist" \
            "$RUNNER_TEMP/installed-profile-path.txt" \
            "$RUNNER_TEMP/app-store-key-path.txt"
          rm -rf "$RUNNER_TEMP/private_keys"
