name: Build signed Android AAB

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: Google Play version code (increase for every upload)
        required: true
        default: "1"
      version_name:
        description: User-visible version name
        required: true
        default: "1.0.0"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK 36
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Install JavaScript dependencies
        shell: bash
        run: |
          if [[ -f package-lock.json ]]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Generate Capacitor Android project
        run: |
          npm run mobile:prepare
          npx cap add android
          npm run android:assets
          node scripts/configure-android-version.mjs "${{ inputs.version_code }}" "${{ inputs.version_name }}"

      - name: Prepare upload key
        id: upload-key
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "Android signing secrets are missing." >&2
            exit 1
          fi

          KEYSTORE_PATH="$RUNNER_TEMP/instrumentquiz-upload.jks"
          if [[ -n "$KEYSTORE_BASE64" ]]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            echo "generated=false" >> "$GITHUB_OUTPUT"
          else
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_PATH" \
              -storetype PKCS12 \
              -storepass "$STORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -alias "$KEY_ALIAS" \
              -keyalg RSA \
              -keysize 4096 \
              -validity 10000 \
              -dname "CN=Jeon Hosang, O=Instrument Fit, C=KR"
            echo "generated=true" >> "$GITHUB_OUTPUT"
          fi
          echo "path=$KEYSTORE_PATH" >> "$GITHUB_OUTPUT"

      - name: Build release bundle
        working-directory: android
        run: ./gradlew bundleRelease

      - name: Sign and verify app bundle
        shell: bash
        run: |
          set -euo pipefail
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          jarsigner \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -keystore "${{ steps.upload-key.outputs.path }}" \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            "$AAB" "$KEY_ALIAS"
          jarsigner -verify "$AAB"
          cp "$AAB" "instrument-fit-${{ inputs.version_name }}-${{ inputs.version_code }}.aab"

      - name: Stage build artifacts
        shell: bash
        run: |
          mkdir -p release-artifacts
          cp "instrument-fit-${{ inputs.version_name }}-${{ inputs.version_code }}.aab" release-artifacts/
          cp package-lock.json release-artifacts/
          if [[ "${{ steps.upload-key.outputs.generated }}" == "true" ]]; then
            cp "${{ steps.upload-key.outputs.path }}" release-artifacts/instrumentquiz-upload.jks
          fi

      - name: Upload signed bundle
        uses: actions/upload-artifact@v7
        with:
          name: instrument-fit-android-${{ inputs.version_code }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 1
